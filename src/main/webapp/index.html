<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>CRUD Application</title>
</head>

<body>

<h1>Add New Employee</h1>

<form action="SaveServlet" method="get">

<table>

<tr>
    <td>Name:</td>
    <td>
        <input type="text" name="name" required>
    </td>
</tr>

<tr>
    <td>Password:</td>
    <td>
        <input type="password" name="password" required>
    </td>
</tr>

<tr>
    <td>Email:</td>
    <td>
        <input type="email" name="email" required>
    </td>
</tr>

<tr>
    <td>Country:</td>
    <td>
        <select name="country">
            <option>India</option>
            <option>USA</option>
            <option>UK</option>
            <option>Other</option>
        </select>
    </td>
</tr>

<tr>
    <td colspan="2">
        <input type="submit" value="Save Employee">
    </td>
</tr>

</table>

</form>

<br>

<a href="ViewServlet">View Employees</a>

</body>
</html>
